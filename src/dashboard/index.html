<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLAPAGOS — Regional AI Governance Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f12;
      --surface: #141720;
      --border: #1e2330;
      --accent: #2563eb;
      --accent-dim: #1e3a6e;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --green: #10b981;
      --yellow: #f59e0b;
      --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 0.85rem;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    header h1 span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .lang-toggle {
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.68rem;
      font-family: var(--font-mono);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .lang-btn:hover:not(.active) { color: var(--text); }

    header a {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-dim);
      text-decoration: none;
    }

    header a:hover { color: var(--text); }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      padding: 1.25rem 2rem;
      border-right: 1px solid var(--border);
    }

    .stat:last-child { border-right: none; }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.35rem;
    }

    .controls {
      padding: 0.85rem 2rem;
      display: flex;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.3rem 0.55rem;
      font-size: 0.78rem;
      font-family: var(--font-sans);
      border-radius: 3px;
      cursor: pointer;
    }

    select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

    .reset-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.3rem 0.7rem;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      border-radius: 3px;
      cursor: pointer;
    }

    .reset-btn:hover { border-color: var(--text-dim); color: var(--text); }

    .count-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .meta-bar {
      padding: 0.4rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 1.5rem;
    }

    .meta-bar span {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }

    .meta-bar span b { color: #94a3b8; font-weight: 500; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1px;
      background: var(--border);
    }

    .card {
      background: var(--bg);
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: background 0.1s;
    }

    .card:hover { background: var(--surface); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
    }

    .badge {
      font-size: 0.62rem;
      font-family: var(--font-mono);
      padding: 0.18rem 0.42rem;
      border-radius: 2px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .badge-governance        { background: var(--accent-dim); color: #93c5fd; }
    .badge-policy            { background: #1e3a2e; color: #6ee7b7; }
    .badge-foundation-models { background: #2d1e3a; color: #c4b5fd; }
    .badge-infrastructure    { background: #1e2a3a; color: #7dd3fc; }
    .badge-safety            { background: #3a1e1e; color: #fca5a5; }

    .card-institution {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
    }

    .card-description {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 0.75rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .type-tag {
      font-size: 0.63rem;
      font-family: var(--font-mono);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .status-dot.passed { background: var(--yellow); }

    .year-tag {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }

    .countries {
      font-size: 0.62rem;
      font-family: var(--font-mono);
      color: var(--text-dim);
      margin-top: 0.5rem;
      line-height: 1.6;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 3rem 2rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.82rem;
      font-family: var(--font-mono);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer span {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    footer a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.68rem;
      font-family: var(--font-mono);
    }

    footer a:hover { color: var(--text); }

    @media (max-width: 640px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .stat { border-right: none; border-bottom: 1px solid var(--border); }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <h1><span>GLAPAGOS</span> / <span id="h-subtitle">regional ai governance dashboard</span></h1>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('es')">ES</button>
      <button class="lang-btn" onclick="setLang('pt')">PT</button>
    </div>
    <a href="https://github.com/castroquiles/glapagos" target="_blank">github</a>
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="stat-total">--</div>
    <div class="stat-label" id="label-initiatives">Initiatives</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-countries">--</div>
    <div class="stat-label" id="label-countries">Countries Covered</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-domains">--</div>
    <div class="stat-label" id="label-domains">Domains</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-types">--</div>
    <div class="stat-label" id="label-types">Initiative Types</div>
  </div>
</div>

<div class="controls">
  <label id="label-domain">Domain</label>
  <select id="filter-domain">
    <option value="" id="opt-all-domain">All</option>
    <option value="governance">Governance</option>
    <option value="policy">Policy</option>
    <option value="foundation-models">Foundation Models</option>
    <option value="infrastructure">Infrastructure</option>
    <option value="safety">Safety</option>
  </select>

  <label id="label-type">Type</label>
  <select id="filter-type">
    <option value="" id="opt-all-type">All</option>
    <option value="multilateral" id="opt-multilateral">Multilateral</option>
    <option value="national" id="opt-national">National</option>
    <option value="research" id="opt-research">Research</option>
    <option value="legislative" id="opt-legislative">Legislative</option>
  </select>

  <label id="label-status">Status</label>
  <select id="filter-status">
    <option value="" id="opt-all-status">All</option>
    <option value="active" id="opt-active">Active</option>
    <option value="passed" id="opt-passed">Passed</option>
  </select>

  <button class="reset-btn" id="reset-btn">reset</button>
  <span class="count-label" id="count-label"></span>
</div>

<div class="meta-bar" id="meta-bar"></div>
<div class="grid" id="grid"></div>

<footer>
  <span id="footer-text">glapagos v0.1.0 -- open multilateral ai platform for the americas</span>
  <a href="https://www.glapagos.com" target="_blank">glapagos.com</a>
</footer>

<script>
  const DATASET = __INITIATIVES_DATA__;

  const I18N = {
    en: {
      subtitle: "regional ai governance dashboard",
      initiatives: "Initiatives",
      countries: "Countries Covered",
      domains: "Domains",
      types: "Initiative Types",
      domain: "Domain",
      type: "Type",
      status: "Status",
      all: "All",
      multilateral: "Multilateral",
      national: "National",
      research: "Research",
      legislative: "Legislative",
      active: "Active",
      passed: "Passed",
      reset: "reset",
      results: function(n) { return n + " result" + (n !== 1 ? "s" : ""); },
      empty: "no initiatives match the current filters.",
      version: "version",
      updated: "updated",
      source: "source",
      footer: "glapagos v0.1.0 -- open multilateral ai platform for the americas",
    },
    es: {
      subtitle: "panel de gobernanza de ia regional",
      initiatives: "Iniciativas",
      countries: "Paises Cubiertos",
      domains: "Dominios",
      types: "Tipos de Iniciativa",
      domain: "Dominio",
      type: "Tipo",
      status: "Estado",
      all: "Todos",
      multilateral: "Multilateral",
      national: "Nacional",
      research: "Investigacion",
      legislative: "Legislativo",
      active: "Activo",
      passed: "Aprobado",
      reset: "reiniciar",
      results: function(n) { return n + " resultado" + (n !== 1 ? "s" : ""); },
      empty: "ninguna iniciativa coincide con los filtros actuales.",
      version: "version",
      updated: "actualizado",
      source: "fuente",
      footer: "glapagos v0.1.0 -- plataforma multilateral abierta de ia para las americas",
    },
    pt: {
      subtitle: "painel de governanca de ia regional",
      initiatives: "Iniciativas",
      countries: "Paises Cobertos",
      domains: "Dominios",
      types: "Tipos de Iniciativa",
      domain: "Dominio",
      type: "Tipo",
      status: "Status",
      all: "Todos",
      multilateral: "Multilateral",
      national: "Nacional",
      research: "Pesquisa",
      legislative: "Legislativo",
      active: "Ativo",
      passed: "Aprovado",
      reset: "redefinir",
      results: function(n) { return n + " resultado" + (n !== 1 ? "s" : ""); },
      empty: "nenhuma iniciativa corresponde aos filtros atuais.",
      version: "versao",
      updated: "atualizado",
      source: "fonte",
      footer: "glapagos v0.1.0 -- plataforma multilateral aberta de ia para as americas",
    }
  };

  var currentLang = "en";

  function setLang(lang) {
    currentLang = lang;
    var t = I18N[lang];
    document.querySelectorAll(".lang-btn").forEach(function(btn) {
      btn.classList.toggle("active", btn.textContent === lang.toUpperCase());
    });
    document.getElementById("h-subtitle").textContent       = t.subtitle;
    document.getElementById("label-initiatives").textContent = t.initiatives;
    document.getElementById("label-countries").textContent   = t.countries;
    document.getElementById("label-domains").textContent     = t.domains;
    document.getElementById("label-types").textContent       = t.types;
    document.getElementById("label-domain").textContent      = t.domain;
    document.getElementById("label-type").textContent        = t.type;
    document.getElementById("label-status").textContent      = t.status;
    document.getElementById("opt-all-domain").textContent    = t.all;
    document.getElementById("opt-all-type").textContent      = t.all;
    document.getElementById("opt-all-status").textContent    = t.all;
    document.getElementById("opt-multilateral").textContent  = t.multilateral;
    document.getElementById("opt-national").textContent      = t.national;
    document.getElementById("opt-research").textContent      = t.research;
    document.getElementById("opt-legislative").textContent   = t.legislative;
    document.getElementById("opt-active").textContent        = t.active;
    document.getElementById("opt-passed").textContent        = t.passed;
    document.getElementById("reset-btn").textContent         = t.reset;
    document.getElementById("footer-text").textContent       = t.footer;
    render();
  }

  function domainClass(domain) {
    var map = {
      "governance":        "badge-governance",
      "policy":            "badge-policy",
      "foundation-models": "badge-foundation-models",
      "infrastructure":    "badge-infrastructure",
      "safety":            "badge-safety",
    };
    return map[domain] || "badge-governance";
  }

  function computeStats(initiatives) {
    var domains = {}, types = {}, countries = new Set();
    initiatives.forEach(function(item) {
      domains[item.domain] = (domains[item.domain] || 0) + 1;
      types[item.type]     = (types[item.type]     || 0) + 1;
      item.countries.forEach(function(c) { countries.add(c); });
    });
    return { domains: domains, types: types, countries: countries };
  }

  function renderCard(item) {
    var countries = item.countries.length > 8
      ? item.countries.slice(0, 8).join(" ") + " +" + (item.countries.length - 8) + " more"
      : item.countries.join(" ");
    return '<div class="card" onclick="window.open(\'' + item.url + '\', \'_blank\')">'
      + '<div class="card-header">'
      + '<div class="card-title">' + item.name + '</div>'
      + '<span class="badge ' + domainClass(item.domain) + '">' + item.domain + '</span>'
      + '</div>'
      + '<div class="card-institution">' + item.institution + '</div>'
      + '<div class="card-description">' + item.description + '</div>'
      + '<div class="card-footer">'
      + '<span class="type-tag">'
      + '<span class="status-dot ' + (item.status !== "active" ? item.status : "") + '"></span>'
      + item.type + ' / ' + item.status
      + '</span>'
      + '<span class="year-tag">' + item.year + '</span>'
      + '</div>'
      + '<div class="countries">' + countries + '</div>'
      + '</div>';
  }

  function getFilters() {
    return {
      domain: document.getElementById("filter-domain").value,
      type:   document.getElementById("filter-type").value,
      status: document.getElementById("filter-status").value,
    };
  }

  function applyFilters(initiatives, filters) {
    return initiatives.filter(function(item) {
      if (filters.domain && item.domain !== filters.domain) return false;
      if (filters.type   && item.type   !== filters.type)   return false;
      if (filters.status && item.status !== filters.status) return false;
      return true;
    });
  }

  function render() {
    var t = I18N[currentLang];
    var filters = getFilters();
    var results = applyFilters(DATASET.initiatives, filters);
    var grid  = document.getElementById("grid");
    var label = document.getElementById("count-label");
    if (results.length === 0) {
      grid.innerHTML = '<div class="empty">' + t.empty + '</div>';
      label.textContent = t.results(0);
      return;
    }
    grid.innerHTML = results.map(renderCard).join("");
    label.textContent = t.results(results.length);
  }

  function init() {
    var t = I18N[currentLang];
    var stats = computeStats(DATASET.initiatives);
    document.getElementById("stat-total").textContent     = DATASET.initiatives.length;
    document.getElementById("stat-countries").textContent = stats.countries.size;
    document.getElementById("stat-domains").textContent   = Object.keys(stats.domains).length;
    document.getElementById("stat-types").textContent     = Object.keys(stats.types).length;
    document.getElementById("meta-bar").innerHTML =
      '<span>' + t.version + ' <b>' + DATASET.version + '</b></span>' +
      '<span>' + t.updated + ' <b>' + DATASET.updated + '</b></span>' +
      '<span>' + t.source  + ' <b>data/initiatives.json</b></span>';
    render();
  }

  document.getElementById("filter-domain").addEventListener("change", render);
  document.getElementById("filter-type").addEventListener("change", render);
  document.getElementById("filter-status").addEventListener("change", render);
  document.getElementById("reset-btn").addEventListener("click", function() {
    document.getElementById("filter-domain").value = "";
    document.getElementById("filter-type").value   = "";
    document.getElementById("filter-status").value = "";
    render();
  });

  init();
</script>
</body>
</html>
